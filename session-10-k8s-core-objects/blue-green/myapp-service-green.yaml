# Declarative form of the blue->green switch. Apply this to promote green:
#   kubectl apply -f blue-green/myapp-service-green.yaml
# Equivalent imperative form:
#   kubectl patch svc myapp-service -n session10 -p '{"spec":{"selector":{"app":"myapp","slot":"green"}}}'
apiVersion: v1
kind: Service
metadata:
  name: myapp-service
  namespace: session10
spec:
  type: NodePort
  selector:
    app: myapp
    slot: green
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30020
