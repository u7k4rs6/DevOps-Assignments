# Healthy example: runs to completion and exits 0 -> phase Succeeded / STATUS Completed.
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-succeeded
  namespace: session10
  labels:
    app: lifecycle
    state: succeeded
spec:
  restartPolicy: Never
  containers:
    - name: task
      image: busybox:1.36
      command:
        - sh
        - -c
        - 'echo "Task started"; sleep 5; echo "Task completed successfully"; exit 0'
