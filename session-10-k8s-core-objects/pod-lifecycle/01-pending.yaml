# INTENTIONAL FAILURE: requests more memory than any node has, so the
# scheduler can never place it. Stays Pending with an Insufficient memory event.
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-pending
  namespace: session10
  labels:
    app: lifecycle
    state: pending
spec:
  containers:
    - name: hungry
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          memory: "500Gi"
          cpu: "200"
