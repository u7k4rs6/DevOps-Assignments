# Healthy example: the container is Running immediately but NOT Ready for ~30s,
# because the readiness probe fails until /tmp/ready is created. Watch READY go 0/1 -> 1/1.
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-readiness
  namespace: session10
  labels:
    app: lifecycle
    state: readiness
spec:
  containers:
    - name: slow-starter
      image: busybox:1.36
      command:
        - sh
        - -c
        - 'echo "Booting, not ready yet"; sleep 30; touch /tmp/ready; echo "Now ready"; sleep 3600'
      readinessProbe:
        exec:
          command: ["cat", "/tmp/ready"]
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 30
