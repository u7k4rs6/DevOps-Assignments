# One pod per node. On single-node minikube that means exactly one pod.
# The container writes a heartbeat in a loop so it stays Running (a bare
# busybox would exit immediately and CrashLoopBackOff).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-logging-agent
  namespace: session10
  labels:
    app: node-logging-agent
spec:
  selector:
    matchLabels:
      app: node-logging-agent
  template:
    metadata:
      labels:
        app: node-logging-agent
    spec:
      containers:
        - name: agent
          image: busybox:1.36
          command:
            - sh
            - -c
            - 'while true; do echo "[$(date)] log agent alive on node ${NODE_NAME}"; sleep 30; done'
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests: {cpu: "10m", memory: "16Mi"}
            limits: {cpu: "50m", memory: "32Mi"}
