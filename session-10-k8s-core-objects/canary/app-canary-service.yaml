# Selects ONLY app=app (not version), so it load-balances across BOTH
# app-stable and app-canary pods. Traffic share = replica share.
apiVersion: v1
kind: Service
metadata:
  name: app-canary-service
  namespace: session10
spec:
  type: NodePort
  selector:
    app: app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30030
